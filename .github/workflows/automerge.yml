name: Auto-merge validated PRs

on:
  workflow_run:
    workflows: ["Validate submission"]
    types: [completed]

permissions:
  pull-requests: write
  contents: write
  actions: read

jobs:
  automerge:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Find associated PR
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.payload.workflow_run.head_repository.full_name}:${context.payload.workflow_run.head_branch}`,
            });

            const pr = pulls.find(
              pull => pull.head.sha === context.payload.workflow_run.head_sha
            );

            if (!pr) {
              core.setFailed("No associated PR found for this workflow run.");
              return;
            }

            core.setOutput("number", pr.number);

      - name: Merge validated PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ steps.pr.outputs.number }}" \
            --repo "${{ github.repository }}" \
            --squash
