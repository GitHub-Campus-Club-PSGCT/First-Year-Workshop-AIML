name: Auto-merge validated PRs

on:
  workflow_run:
    workflows: ["Validate submission"]
    types: [completed]

permissions:
  pull-requests: write
  contents: write
  actions: read

jobs:
  automerge:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Find associated PR
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const response = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.payload.workflow_run.head_sha,
            });

            if (response.data.length === 0) {
              core.setFailed("No associated PR found for this workflow run.");
              return;
            }

            core.setOutput("number", response.data[0].number);

      - name: Merge validated PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ steps.pr.outputs.number }}" \
            --repo "${{ github.repository }}" \
            --squash
